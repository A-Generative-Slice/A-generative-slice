<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG Card — A Generative Slice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0a;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 88% -10%, rgba(255, 92, 0, 0.28), transparent 60%),
      radial-gradient(ellipse 700px 420px at -5% 110%, rgba(255, 140, 26, 0.12), transparent 60%);
  }
  .grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 70% 30%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 70% 30%, black 30%, transparent 75%);
  }
  .wedge {
    position: absolute; right: -140px; top: -160px;
    width: 620px; height: 620px; border-radius: 50%;
    background: conic-gradient(from 210deg, transparent 0deg, rgba(255,92,0,0.5) 40deg, rgba(255,140,26,0.22) 80deg, transparent 120deg);
    filter: blur(2px);
    opacity: 0.85;
  }
  .ring {
    position: absolute; right: 60px; bottom: -220px;
    width: 460px; height: 460px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.08);
  }
  .ring::after {
    content: ''; position: absolute; inset: 46px; border-radius: 50%;
    border: 1.5px dashed rgba(255,140,26,0.25);
  }
  .content {
    position: relative; z-index: 2;
    height: 100%; padding: 64px 72px;
    display: flex; flex-direction: column;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.28em;
    text-transform: uppercase; color: #ff8c1a;
    margin-bottom: 30px;
  }
  .eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5c00; box-shadow: 0 0 18px rgba(255,92,0,0.9); }
  h1 {
    font-family: 'Montserrat', 'Inter', sans-serif;
    font-weight: 900; font-size: 88px; line-height: 1.02;
    letter-spacing: -0.02em; margin-bottom: 22px;
  }
  h1 .grad {
    background: linear-gradient(92deg, #ffb066 0%, #ff5c00 55%, #ff8c1a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline {
    font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.78);
    letter-spacing: -0.01em; margin-bottom: 40px;
  }
  .chips { display: flex; gap: 14px; margin-bottom: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 20px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05);
    font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.85);
  }
  .chip b { color: #ff8c1a; font-weight: 800; }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 26px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .domain { font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
  .domain span { color: #ff8c1a; }
  .meta { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.5); display: flex; gap: 22px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="wedge"></div>
  <div class="ring"></div>
  <div class="content">
    <div class="eyebrow"><span class="dot"></span>Chennai · Tamil Nadu · India</div>
    <h1>A Generative <span class="grad">Slice</span></h1>
    <div class="tagline">AI Automation &amp; Bespoke Web Systems Studio</div>
    <div class="chips">
      <span class="chip"><b>8</b> client systems in production</span>
      <span class="chip"><b>7</b> products in the Slice Suite</span>
      <span class="chip"><b>Free</b> first consultation</span>
    </div>
    <div class="footer">
      <div class="domain">agenerativeslice<span>.com</span></div>
      <div class="meta"><span>+91 78128 91494</span><span>Nungambakkam, Chennai</span></div>
    </div>
  </div>
</body>
</html>
