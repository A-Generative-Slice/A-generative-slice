<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radial1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF5C00" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FF8C1A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radial2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF5C00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 92, 0, 0.07)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(255, 92, 0, 0.25)" />
    </pattern>
  </defs>

  <!-- Ambient Dark Canvas -->
  <rect width="100%" height="100%" fill="#0A0A0A" />

  <!-- Radial Glow Orbs -->
  <rect width="100%" height="100%" fill="url(#radial1)" />
  <rect width="100%" height="100%" fill="url(#radial2)" />

  <!-- Precision Architectural Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Subtle Ambient Circles -->
  <circle cx="960" cy="400" r="380" stroke="rgba(255, 92, 0, 0.12)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="960" cy="400" r="560" stroke="rgba(255, 92, 0, 0.08)" stroke-width="1" />
  <circle cx="960" cy="400" r="740" stroke="rgba(255, 92, 0, 0.04)" stroke-width="1" stroke-dasharray="16 16" />
</svg>
